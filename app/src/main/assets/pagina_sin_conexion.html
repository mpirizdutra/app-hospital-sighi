<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 50px auto;
            background-color: #f0f0f0;
        }
        .container {
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 300px;
            margin: auto;
        }
        h1 { color: #cc0000; font-size: 20px; }
        .btn-reconnect {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>❌ ¡Error de Conexión!</h1>
    <p>No pudimos establecer conexión con el servidor (tu: http://192.168.1.40:3000/).</p>
    <p>Por favor, revisa tu conexión a la red local.</p>
    <button class="btn-reconnect" onclick="reconnect()">
        Intentar de nuevo
    </button>
</div>

<script>
    function reconnect() {

        // Llama a la función nativa de Android que recargará la WebView.
        // 'Android' es el nombre que le daremos a la interfaz en Java.
        if (typeof Android !== 'undefined' && Android !== null) {
            Android.reloadOriginalUrl();
        } else {
            // Alternativa de fallback si la interfaz no está definida
            window.location.reload();
        }
    }
</script>
</body>
</html>
